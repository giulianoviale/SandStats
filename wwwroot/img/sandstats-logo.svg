<?xml version="1.0" encoding="UTF-8"?>
<svg width="220" height="40" viewBox="0 0 220 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .sea{fill:#2A9D8F}
      .sun{fill:#F4A261}
      .stroke{stroke:#2A9D8F;stroke-width:2;stroke-linecap:round;fill:none}
      .word{font: 700 22px 'Saira Condensed', 'Arial Narrow', Arial, sans-serif; fill:#0F172A; letter-spacing:.5px}
      .sub{font: 500 11px 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif; fill:#475569}
    </style>
  </defs>

  <!-- mark -->
  <g transform="translate(2,4)">
    <circle cx="16" cy="16" r="10.5" stroke="#2A9D8F" stroke-width="2"/>
    <path class="stroke" d="M7 16c2.2-2.0 5.9-3.3 9-3.3S22.8 14 25 16"/>
    <path class="stroke" d="M10.2 8.5C12 10.4 14 13.6 14 16s-2 5.6-3.8 7.5"/>
    <path class="stroke" d="M21.8 8.5C20 10.4 18 13.6 18 16s2 5.6 3.8 7.5"/>
    <rect x="22.8" y="20.8" width="2.2" height="4.2" rx="0.7" class="sea"/>
    <rect x="26" y="18.6" width="2.2" height="6.4" rx="0.7" class="sun"/>
  </g>

  <!-- wordmark -->
  <text x="48" y="22" class="word">SandStats</text>
  <text x="48" y="34" class="sub">Beach Volleyball Analytics</text>
</svg>
